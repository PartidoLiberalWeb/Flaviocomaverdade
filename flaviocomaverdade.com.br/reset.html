<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resetar visitas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f5;
      color: #18181b;
    }
    main { text-align: center; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 24px;
      background: #b91c1c;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 1.5em; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <button id="resetButton" type="button">Resetar visitas</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    "use strict";

    const API_URL = "https://contador-api-site.portalverdade13.workers.dev";
    const button = document.getElementById("resetButton");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      const confirmed = window.confirm(
        "Tem certeza de que deseja zerar os contadores de visitas? Esta ação pode ser irreversível."
      );
      if (!confirmed) return;

      const token = window.prompt("Digite a chave de administração configurada na Cloudflare:");
      if (!token) {
        status.textContent = "Operação cancelada.";
        return;
      }

      button.disabled = true;
      status.textContent = "A processar…";

      try {
        const response = await fetch(API_URL + "/reset", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ confirm: true })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || "Não foi possível resetar. Verifique a configuração da API.");
        }
        status.textContent = "Contadores resetados com sucesso.";
      } catch (error) {
        status.textContent = "Falha: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
