<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uma informação do Flávio</title>
  <meta name="description" content="Uma informação para refletir.">
  <link rel="stylesheet" href="../../style.css">
  <style>
    /*
      A página reaproveita o CSS principal (style.css) e acrescenta somente
      os ajustes necessários para organizar o conteúdo do card.
    */
    .topico-page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(28px, 5vw, 64px) 0;
    }

    .topico-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, .9fr);
      gap: 0;
      overflow: hidden;
      border: 2px solid #111;
      border-radius: 20px;
      background: #fff;
      box-shadow: 7px 7px 0 #0860a8;
    }

    .topico-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(24px, 5vw, 56px);
    }

    .topico-eyebrow {
      margin-bottom: 14px;
      color: #111;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .topico-title {
      margin: 0 0 20px;
      color: #0860a8;
      line-height: 1.1;
    }

    .topico-message {
      margin: 0;
      line-height: 1.75;
      font-size: 1.08rem;
    }

    .topico-photo {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      padding: 18px;
      background: #f0f2f5;
    }

    .topico-photo img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 320px;
      max-height: 650px;
      object-fit: contain;
    }

    .topico-photo img[hidden] {
      display: none;
    }

    .topico-image-error {
      max-width: 280px;
      margin: 0;
      line-height: 1.6;
      text-align: center;
    }

    .topico-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .topico-actions a,
    .topico-actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 11px 16px;
      border: 2px solid #111;
      border-radius: 12px;
      background: #ffca05;
      box-shadow: 3px 3px 0 #111;
      color: #111;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .topico-actions a:hover,
    .topico-actions button:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #111;
    }

    .topico-actions .topico-whatsapp {
      background: #12b653;
    }

    .topico-status {
      min-height: 1.3em;
      margin-top: 14px;
      font-size: .88rem;
    }

    @media (max-width: 760px) {
      .topico-card {
        grid-template-columns: 1fr;
      }

      .topico-copy {
        order: 1;
      }

      .topico-photo {
        order: 2;
        min-height: 240px;
      }

      .topico-photo img {
        min-height: 240px;
        max-height: 480px;
      }

      .topico-actions > * {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

      return "Olha essa informação do Flávio " + PAGE_URL;
    }

    function refresh() {
      document.getElementById("topico-message").textContent = randomItem(MESSAGES);
      var img = document.getElementById("topico-image");
      var error = document.getElementById("topico-image-error");
      error.hidden = true;
      img.hidden = false;
      img.onerror = function () {
        img.hidden = true;
        error.hidden = false;
      };
      img.src = "https://drive.google.com/uc?export=view&id=" + encodeURIComponent(randomItem(DRIVE_IMAGE_IDS));

    }

    document.getElementById("topico-next").addEventListener("click", refresh);
    document.getElementById("topico-copy").addEventListener("click", function () {
      var status = document.getElementById("topico-status");
      var value = shareText();

      function fallback() {
        var input = document.createElement("textarea");
        input.value = value;
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.select();
        try {
          document.execCommand("copy");
          status.textContent = "Frase e link copiados.";
        } catch (e) {
          status.textContent = "Não foi possível copiar automaticamente: " + value;
        }
        input.remove();
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value)
          .then(function () { status.textContent = "Frase e link copiados."; })
          .catch(fallback);
      } else {
        fallback();
      }
    });
